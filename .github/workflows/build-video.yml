name: Build video from image + audio

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "Direct-download URL for the audio"
        required: true
        type: string
      resolution:
        description: "Video resolution"
        required: true
        type: choice
        options:
          - 360p
          - 480p
          - 720p
          - 1080p
        default: 720p

permissions:
  contents: read

concurrency:
  group: image-audio-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-and-validate:
    name: Validate image and download audio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      audio_duration: ${{ steps.validate.outputs.audio_duration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Automatically find the latest uploaded image
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import subprocess

          allowed = {".png", ".jpg", ".jpeg", ".webp", ".bmp", ".gif", ".tif", ".tiff"}
          candidates = [
              p for p in pathlib.Path(".").iterdir()
              if p.is_file() and p.suffix.lower() in allowed
          ]
          if not candidates:
              raise SystemExit(
                  "::error::No image found in the repository root. Upload an image file (PNG, JPG, WebP, etc.) and run again."
              )

          def last_changed(path):
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", path.name],
                  check=True, capture_output=True, text=True
              )
              return int(result.stdout.strip() or "0")

          candidates.sort(key=lambda p: (last_changed(p), p.name), reverse=True)
          chosen = candidates[0]
          print(f"Using latest uploaded image: {chosen.name}")
          with open("selected-image.txt", "w", encoding="utf-8") as f:
              f.write(chosen.name)
          PY
          image_name="$(cat selected-image.txt)"
          file "$image_name"
          if ! identify "$image_name" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          identify "$image_name" >/dev/null
          cp "$image_name" input-image
          test -s input-image

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download audio
        env:
          MEDIA_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --connect-timeout 20 --max-time 3600 \
            "$MEDIA_URL" -o input-audio
          test -s input-audio
          echo "Audio downloaded: $(stat -c%s input-audio) bytes"
          file input-audio
          if [ "$(stat -c%s input-audio)" -lt 16384 ]; then
            echo "::error::Downloaded audio is under 16 KiB. The URL may be a preview/error response or an incomplete file."
            exit 1
          fi
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input-audio)"
          python - "$duration" <<'PY'
          import sys
          try:
              d = float(sys.argv[1])
          except Exception:
              raise SystemExit("Could not read audio duration")
          if d <= 1:
              raise SystemExit(f"Audio duration {d:.3f}s is too short; refusing to create a misleading video.")
          print(f"Audio duration: {d:.3f} seconds ({d/60:.2f} minutes)")
          PY
          ffmpeg -v error -i input-audio -f null -

      - name: Prepare validated inputs
        id: validate
        run: |
          set -euo pipefail
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input-audio)"
          echo "audio_duration=$duration" >> "$GITHUB_OUTPUT"
          mkdir -p validated
          cp image.jpg validated/input-image
          cp input-audio validated/input-audio

      - name: Upload validated inputs
        uses: actions/upload-artifact@v4
        with:
          name: validated-media
          path: validated/
          if-no-files-found: error
          retention-days: 1

  render:
    name: Render MP4
    runs-on: ubuntu-latest
    needs: download-and-validate
    timeout-minutes: 180
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download validated inputs
        uses: actions/download-artifact@v4
        with:
          name: validated-media
          path: media

      - name: Render video
        env:
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -euo pipefail
          case "$RESOLUTION" in
            360p) WIDTH=640; HEIGHT=360 ;;
            480p) WIDTH=854; HEIGHT=480 ;;
            720p) WIDTH=1280; HEIGHT=720 ;;
            1080p) WIDTH=1920; HEIGHT=1080 ;;
            *) echo "::error::Unsupported resolution: $RESOLUTION"; exit 1 ;;
          esac
          test -s media/input-image
          test -s media/input-audio
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 media/input-audio)"
          echo "Rendering at ${WIDTH}x${HEIGHT}, 30 fps, audio duration ${duration}s"
          ffmpeg -hide_banner -y \
            -loop 1 -framerate 30 -i media/input-image \
            -i media/input-audio \
            -map 0:v:0 -map 1:a:0 \
            -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=decrease,pad=${WIDTH}:${HEIGHT}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,fps=30,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 23 \
            -c:a aac -b:a 192k \
            -t "$duration" -movflags +faststart output.mp4
          test -s output.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of json output.mp4 | tee output-info.json
          video_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output.mp4)"
          python - "$duration" "$video_duration" <<'PY'
          import sys
          src, out = map(float, sys.argv[1:3])
          print(f"Source audio: {src:.3f}s; output video: {out:.3f}s")
          if out < src * 0.98:
              raise SystemExit("Output video is unexpectedly shorter than the source audio.")
          PY

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: output-video
          path: |
            output.mp4
            output-info.json
          if-no-files-found: error
          retention-days: 7
