name: Build video from image + audio

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Direct-download URL for the image"
        required: true
        type: string
      audio_url:
        description: "Direct-download URL for the audio"
        required: true
        type: string
      resolution:
        description: "Output resolution"
        required: true
        type: choice
        options:
          - 1920x1080
          - 1280x720
          - 1080x1920
        default: 1920x1080
      fps:
        description: "Frames per second"
        required: true
        type: choice
        options:
          - "24"
          - "30"
          - "60"
        default: "30"

permissions:
  contents: read

concurrency:
  group: image-audio-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-and-validate:
    name: Download and validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      audio_duration: ${{ steps.validate.outputs.audio_duration }}
    steps:
      - name: Download image
        env:
          MEDIA_URL: ${{ inputs.image_url }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "$MEDIA_URL" -o input-image
          test -s input-image
          echo "Image downloaded: $(stat -c%s input-image) bytes"
          file input-image
          if ! identify input-image >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
            identify input-image
          fi
          identify input-image >/dev/null

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download audio
        env:
          MEDIA_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --connect-timeout 20 --max-time 3600 \
            "$MEDIA_URL" -o input-audio
          test -s input-audio
          echo "Audio downloaded: $(stat -c%s input-audio) bytes"
          file input-audio
          # Reject suspiciously tiny files before FFprobe/FFmpeg processing.
          if [ "$(stat -c%s input-audio)" -lt 16384 ]; then
            echo "::error::Downloaded audio is under 16 KiB. The URL may be a preview/error response or an incomplete file."
            exit 1
          fi
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input-audio > audio-duration.txt
          duration="$(cat audio-duration.txt)"
          python - "$duration" <<'PY'
          import sys
          try:
              d = float(sys.argv[1])
          except Exception:
              raise SystemExit("Could not read audio duration")
          if d <= 1:
              raise SystemExit(f"Audio duration {d:.3f}s is too short; refusing to create a misleading video.")
          print(f"Audio duration: {d:.3f} seconds ({d/60:.2f} minutes)")
          PY
          ffmpeg -v error -i input-audio -f null -

      - name: Validate image and publish duration
        id: validate
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input-audio
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input-audio)"
          echo "audio_duration=$duration" >> "$GITHUB_OUTPUT"
          identify input-image
          mkdir -p validated
          cp input-image validated/input-image
          cp input-audio validated/input-audio
          cp audio-duration.txt validated/audio-duration.txt

      - name: Upload validated inputs
        uses: actions/upload-artifact@v4
        with:
          name: validated-media
          path: validated/
          if-no-files-found: error
          retention-days: 1

  render:
    name: Render MP4
    runs-on: ubuntu-latest
    needs: download-and-validate
    timeout-minutes: 180
    steps:
      - name: Install FFmpeg and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Download validated inputs
        uses: actions/download-artifact@v4
        with:
          name: validated-media
          path: media

      - name: Render video
        env:
          RESOLUTION: ${{ inputs.resolution }}
          FPS: ${{ inputs.fps }}
        run: |
          set -euo pipefail
          IFS=x read -r WIDTH HEIGHT <<< "$RESOLUTION"
          test -s media/input-image
          test -s media/input-audio
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 media/input-audio)"
          echo "Rendering at ${WIDTH}x${HEIGHT}, ${FPS} fps, audio duration ${duration}s"
          ffmpeg -hide_banner -y \
            -loop 1 -framerate "$FPS" -i media/input-image \
            -i media/input-audio \
            -map 0:v:0 -map 1:a:0 \
            -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=decrease,pad=${WIDTH}:${HEIGHT}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,fps=${FPS},format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 23 \
            -c:a aac -b:a 192k \
            -t "$duration" -movflags +faststart output.mp4
          test -s output.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of json output.mp4 | tee output-info.json
          video_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output.mp4)"
          python - "$duration" "$video_duration" <<'PY'
          import sys
          src, out = map(float, sys.argv[1:3])
          print(f"Source audio: {src:.3f}s; output video: {out:.3f}s")
          if out < src * 0.98:
              raise SystemExit("Output video is unexpectedly shorter than the source audio.")
          PY

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: output-video
          path: |
            output.mp4
            output-info.json
          if-no-files-found: error
          retention-days: 7
